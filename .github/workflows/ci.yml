name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly. This is the part that matters: the pinned dependencies are fetched
    # at build time and ESPHome has no upper version bound, so nothing here is
    # frozen in practice. A build that only runs on push would go stale silently.
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  build:
    name: Build the example (ESPHome ${{ matrix.esphome }})
    runs-on: ubuntu-latest
    strategy:
      # Both legs run to completion. Which one broke is the whole question:
      # latest going red means ESPHome moved, floor going red means the
      # version this repository tells people is enough no longer is.
      fail-fast: false
      matrix:
        # Two versions, because readers arrive with two different ones.
        # `latest` is what the ESPHome Device Builder add-on runs. `floor` is
        # min_version, which until now was only ever declared, never built —
        # anyone building inside an environment that ships its own ESPHome
        # (the Studio Code Server add-on, for one) rather than tracking the
        # latest release was relying on an unchecked promise.
        esphome: [latest, floor]
    steps:
      # Bumped from v4 in 2026-08: Node 20 is deprecated and these were being
      # forced onto Node 24 with a warning on every run.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # One version that satisfies both legs: ESPHome 2025.11.0 requires
          # <3.14 and 2026.7.x requires >=3.12. If the floor ever moves past
          # what this Python can install, that shows up here as a red build
          # rather than as a wrong claim in the README.
          python-version: "3.13"

      - name: Install ESPHome
        # latest is deliberately not pinned. The point of the weekly run is to
        # find out when a new ESPHome release breaks this, so a red build there
        # means something real. Whether it still *works on hardware* is a
        # separate claim that only a person with an M5Dial can make; the README
        # says so in its own words and is not checked here.
        #
        # floor reads the version out of the package instead of repeating it.
        # README.md and packages/m5dial.yaml already state the floor twice and
        # a step below checks they agree; writing it here as well would add a
        # third copy to drift.
        run: |
          if [ "${{ matrix.esphome }}" = latest ]; then
            pip install esphome
          else
            version=$(sed -n 's/^ *min_version: *\([0-9][0-9.]*\).*/\1/p' packages/m5dial.yaml)
            if [ -z "$version" ]; then
              echo "no min_version found in packages/m5dial.yaml" >&2
              exit 1
            fi
            pip install "esphome==$version"
          fi

      - name: Record the ESPHome version
        run: esphome version

      - name: Build the example exactly as published
        # The YAML printed in README.md is generated from examples/m5dial.yaml,
        # and a separate step below checks they still match. Building this file
        # is therefore building what a reader would copy.
        #
        # Only the source of the component is redirected, to this checkout
        # instead of a tag: on a pull request the tag does not yet contain the
        # change being tested.
        run: |
          mkdir -p build && cd build
          python - <<'PY'
          import base64, os, pathlib, re
          src = pathlib.Path('../examples/m5dial.yaml').read_text()
          src = re.sub(r"packages:\n  astrolabe:\n(?:    .*\n)+",
                       "packages:\n  astrolabe: !include ../packages/m5dial.yaml\n", src)
          src = src.replace("substitutions:\n  name: astrolabe",
                            "substitutions:\n  astrolabe_source: ../components\n  name: astrolabe")
          pathlib.Path('astrolabe.yaml').write_text(src)
          key = base64.b64encode(os.urandom(32)).decode()
          pathlib.Path('secrets.yaml').write_text(
              'wifi_ssid: "ci-network"\n'
              'wifi_password: "ci-password"\n'
              f'api_encryption_key: "{key}"\n'
              'ota_password: "ci-ota-password"\n')
          PY
          esphome config astrolabe.yaml
          esphome compile astrolabe.yaml

      - name: Build with diagnostics as well
        # Diagnostics are optional, so nothing else would catch a break here.
        run: |
          cd build
          python - <<'PY'
          import pathlib
          p = pathlib.Path('astrolabe.yaml')
          p.write_text(p.read_text().replace(
              "packages:\n  astrolabe: !include ../packages/m5dial.yaml\n",
              "packages:\n  astrolabe: !include ../packages/m5dial.yaml\n"
              "  astrolabe_diagnostics: !include ../packages/diagnostics.yaml\n"))
          PY
          esphome config astrolabe.yaml
          esphome compile astrolabe.yaml

      # The three steps below do not touch ESPHome, so they run on one leg only.
      # Running them per-version would double the noise without doubling what
      # is checked.
      - name: Run the host tests
        if: matrix.esphome == 'latest'
        # HaRange decides whether a number from Home Assistant may be shown and
        # whether it may be sent back. It has no hardware in it, so it can be
        # tested here — which matters, because the cases that make it necessary
        # are hard to produce on a device: a light reporting a value outside its
        # own stated range, or an attribute vanishing at the wrong moment.
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -o /tmp/test_ha_value tests/test_ha_value.cpp
          /tmp/test_ha_value

      - name: Check that README still prints the example verbatim
        if: matrix.esphome == 'latest'
        # If these drift, the YAML people copy is not the YAML that was built.
        run: |
          python - <<'PY'
          import pathlib, re, sys
          readme = pathlib.Path('README.md').read_text()
          example = pathlib.Path('examples/m5dial.yaml').read_text()
          block = re.search(r"```yaml\n(.*?)```\n", readme, re.S)
          if block is None:
              sys.exit("README.md has no yaml block")
          if block.group(1) != example:
              sys.exit("README.md and examples/m5dial.yaml have drifted apart")
          print("README matches examples/m5dial.yaml")
          PY

      - name: Check that the README's stated minimum matches the package
        if: matrix.esphome == 'latest'
        # Two places state the floor. If they drift, one of them is lying.
        # The floor leg above builds against whichever version this finds, so
        # the two of them together are what turns the claim into a checked one.
        run: |
          python - <<'PY'
          import pathlib, re, sys
          readme = pathlib.Path('README.md').read_text()
          package = pathlib.Path('packages/m5dial.yaml').read_text()
          claimed = re.search(r"ESPHome ([0-9]+\.[0-9]+\.[0-9]+) or newer", readme)
          enforced = re.search(r"min_version: ([0-9]+\.[0-9]+\.[0-9]+)", package)
          if claimed is None or enforced is None:
              sys.exit("could not find the version in README.md or packages/m5dial.yaml")
          if claimed.group(1) != enforced.group(1):
              sys.exit(f"README says {claimed.group(1)}, min_version says {enforced.group(1)}")
          print(f"minimum agrees: {claimed.group(1)}")
          PY
