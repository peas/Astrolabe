# Astrolabe — board definition for the M5Dial.
#
# You do not edit this file. Pull it in from `packages:` as shown in
# examples/m5dial.yaml and write only your slots and credentials.
#
# Only two kinds of thing belong here: facts about the board, and settings
# astrolabe_ui cannot work without. Anything that is a matter of taste lives
# on the user's side.

substitutions:
  name: astrolabe
  friendly_name: Astrolabe
  # Self-reference: which version of the component to pull in.
  # Bumping a release means changing this one line.
  astrolabe_source: github://Khronos31/Astrolabe@v0.1.0

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # A floor, not a ceiling. ESPHome Device Builder always runs the latest
  # release, so this cannot protect you from a future version breaking the
  # build; the weekly CI run is what catches that.
  min_version: 2025.11.0
  project:
    name: Khronos31.Astrolabe
    version: "0.1.0"

logger:
  # Release default. ESPHome strips log calls below this level at compile time,
  # so leaving DEBUG on keeps every verbose string in the binary.
  # Add packages/diagnostics.yaml to turn them back on.
  level: INFO

esp32:
  # The M5Dial is a StampS3A: ESP32-S3, 8 MB flash, no PSRAM.
  # No board-specific definition is needed; astrolabe_ui drives the display
  # and the touch panel itself.
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

external_components:
  - source: ${astrolabe_source}
    components: [astrolabe_ui]

output:
  # Feedback beeper, on GPIO3.
  # The frequency set here is only the initial value; astrolabe_ui changes it
  # per input so that you can tell what you did without looking.
  - platform: ledc
    id: astrolabe_buzzer
    frequency: 4000Hz
    pin:
      number: GPIO3
      # GPIO3 is a strapping pin on the ESP32-S3. That is how the board is
      # wired, so the warning is unavoidable and carries no information here.
      # Check this again if you port the component to another board.
      ignore_strapping_warning: true

astrolabe_ui:
  # The id is fixed here because the encoder and button lambdas below, and the
  # sensors in packages/diagnostics.yaml, refer to it by name. If it were on
  # the user's side, renaming it would break the build for reasons that are not
  # visible from where the change was made.
  id: astrolabe_ui_id
  buzzer: astrolabe_buzzer

api:
  # Both default to off in ESPHome. They switch the USE_API_HOMEASSISTANT_STATES
  # and _SERVICES defines, and both subscribe_homeassistant_state and
  # call_homeassistant_service live behind those. astrolabe_ui refuses to build
  # without them, so they are set here.
  # Your encryption key goes on your side; the two are merged.
  homeassistant_states: true
  homeassistant_services: true

time:
  # Used by the idle clock. Without it the clock shows --:-- forever, so
  # astrolabe_ui refuses to build if no time source is configured.
  - platform: homeassistant
    id: astrolabe_time

sensor:
  # The knob.
  # Pin A and B are deliberately swapped relative to the schematic: wiring them
  # as drawn makes the dial turn the wrong way, because ESPHome's idea of
  # "clockwise" is the opposite of the board's A/B assignment.
  # If that ever needs fixing, fix it here — not by swapping the two lambdas,
  # which would leave "clockwise goes to the next slot" reading as a lie.
  - platform: rotary_encoder
    id: astrolabe_encoder
    name: Dial
    entity_category: diagnostic
    pin_a:
      number: GPIO40
      mode: {input: true, pullup: true}
    pin_b:
      number: GPIO41
      mode: {input: true, pullup: true}
    on_clockwise:
      - lambda: 'id(astrolabe_ui_id)->go_next();'
    on_anticlockwise:
      - lambda: 'id(astrolabe_ui_id)->go_last();'

binary_sensor:
  # Pressing the knob.
  - platform: gpio
    id: astrolabe_button
    name: Dial Button
    entity_category: diagnostic
    pin:
      number: GPIO42
      mode: {input: true, pullup: true}
      inverted: true
    on_press:
      - lambda: 'id(astrolabe_ui_id)->on_button_pressed();'
